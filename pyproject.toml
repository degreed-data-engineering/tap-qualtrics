[tool.poetry]
name = "tap-qualtrics"
version = "0.0.1"
description = "`tap-qualtrics` is Singer-compliant qualtrics tap built with Singer SDK."
authors = ["Derek Visch <dvisch@autoidm.com>"]
license = "Apache v2"

[tool.poetry.dependencies]
python = ">=3.9.2,<3.13"
requests = "^2.32.4"
# singer-sdk 0.48.x is the last line supporting Python 3.9; it drops the cryptography<4 cap
# that kept CVE-2023-50782 (cryptography 3.4.8) in this tap's venv (PD-132295).
singer-sdk = "^0.48.1"
cryptography = "^44.0.1"
pandas = "^1.3.4"
# pandas 1.x wheels are built against the numpy 1.x ABI; numpy 2 (default on py3.9 since 2024) causes
# "numpy.dtype size changed" at import, which is why this venv currently fails in the meltano image.
numpy = "<2.0"
[tool.poetry.dev-dependencies]
pytest = "^6.2.5"
tox = "^3.24.4"
flake8 = "^3.9.2"
black = "^21.9b0"
pydocstyle = "^6.1.1"
mypy = "^0.910"
types-requests = "^2.26.1"
isort = "^5.10.1"

[tool.poetry.group.dev.dependencies]
viztracer = "^0.15.4"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "tap_qualtrics"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
tap-qualtrics = 'tap_qualtrics.tap:cli'
